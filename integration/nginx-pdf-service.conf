# Added to the ERP's existing nginx server block (the TLS-terminating one).
# Browsers reach the PDF service through the ERP's own domain: no ALB, no public
# IP on the PDF box, no CORS, and the service sets PUBLIC_BASE_URL=https://<erp-domain>/pdf
location /pdf/ {
    proxy_pass http://10.0.1.25:8080/;          # PDF service private IP, same AZ
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;                         # SSE progress + streamed downloads
    proxy_read_timeout 75s;                      # long-poll waits <= 25s; SSE pings every 15s
    client_max_body_size 26m;                    # /v1/verify uploads
}

# The internal API (POST /v1/documents, /v1/bulk) is called by Django directly on
# the private IP. Don't expose it publicly through this proxy:
location ~ ^/pdf/v1/(documents|bulk)$ {
    return 404;
}
